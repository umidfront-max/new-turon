# Dockerfile buni /etc/nginx/conf.d/default.conf ga qo'yadi, shuning uchun
# faqat server bloki — http{} o'ramisiz.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history rejimida: /queue/blocked, /application?id=4 kabi
    # manzillarda fayl yo'q, hammasi index.html orqali ochiladi.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nomida xesh bo'lgan fayllar (assets/index-BKEXTpWn.js) hech qachon
    # o'zgarmaydi — uzoq muddat keshlanadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html keshlanmaydi: yangi build chiqqanda brauzer eskisida qolib
    # ketmasligi kerak.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # yuklanmagan rasm/shrift uchun jurnal to'lib ketmasin
    location = /favicon.ico { access_log off; log_not_found off; }
}
